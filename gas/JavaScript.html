<script>
(function(){'use strict';var config=window.APP_BOOTSTRAP,user=window.APP_USER,step=1,state={metadata:{},answers:{},attachments:[],existingFiles:[],removeFileIds:[],editingId:''};var labels=['Context','Metadata','Vetting','Attachments','Review'];
function el(id){return document.getElementById(id)}function esc(v){var d=document.createElement('div');d.textContent=String(v==null?'':v);return d.innerHTML}function run(name,args){return new Promise(function(resolve,reject){var runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){try{reject(JSON.parse(e.message));}catch(x){reject({message:e.message||'Request failed'});}});runner[name].apply(runner,args||[]);});}
el('userName').textContent=user.name+' · '+user.email;el('roles').textContent=user.roles.join(', ');el('adminNav').hidden=!user.privileged;
document.querySelectorAll('nav button').forEach(function(button){button.onclick=function(){document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active');});button.classList.add('active');['intake','submissions','admin'].forEach(function(p){el(p+'Page').hidden=p!==button.dataset.page;});if(button.dataset.page==='submissions')loadSubmissions();if(button.dataset.page==='admin')loadAdmin();};});
function renderSteps(){el('steps').innerHTML=labels.map(function(label,i){return '<button type="button" class="'+(step===i+1?'active':step>i+1?'done':'')+'"><b>'+(step>i+1?'✓':i+1)+'</b><span>'+label+'</span></button>';}).join('');}
function input(field,prefix){var value=(state[prefix]||{})[field.key]||'';var control=field.options&&field.options.length?'<select data-prefix="'+prefix+'" data-key="'+field.key+'"><option value="">Select…</option>'+field.options.map(function(o){return '<option '+(o===value?'selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>':field.type==='textarea'?'<textarea data-prefix="'+prefix+'" data-key="'+field.key+'">'+esc(value)+'</textarea>':'<input data-prefix="'+prefix+'" data-key="'+field.key+'" type="'+(field.type==='date'?'date':'text')+'" value="'+esc(value)+'">';return '<label class="field"><span>'+esc(field.label)+(field.required?' *':'')+'</span>'+control+'</label>';}
function render(){renderSteps();var html='';if(step===1)html='<h2>'+(state.editingId?'Correction for '+esc(state.editingId):'Submission context')+'</h2><p class="muted">Identity and authorization are repeated on every server operation.</p><div class="context"><div><span>Submitting as</span><b>'+esc(user.email)+'</b></div><div><span>Access</span><b>Workspace identity verified</b></div></div><div class="callout">Routes and destinations are determined on the server. The browser never supplies a folder ID or Sheet tab.</div>';if(step===2)html='<h2>Document metadata</h2><p class="muted">All required fields are validated again by the server.</p><div class="grid">'+config.metadataFields.map(function(f){return input(f,'metadata');}).join('')+'</div>';if(step===3){var qs=config.vettingQuestions.filter(function(q){return !q.showWhen||state.answers[q.showWhen.key]===q.showWhen.equals;});html='<h2>Vetting questions</h2><p class="muted">These configured answers drive deterministic routing.</p><div class="questions">'+qs.map(function(q){return input(q,'answers');}).join('')+'</div>';}if(step===4)html='<h2>Supporting attachments</h2><p class="muted">PDF, DOCX, XLSX, TXT · maximum '+config.filePolicy.maxFileCount+' files.</p><label class="drop"><input id="fileInput" type="file" multiple accept=".pdf,.docx,.xlsx,.txt"><b>Choose files</b></label><div class="files">'+state.existingFiles.filter(function(f){return state.removeFileIds.indexOf(String(f.file_token))<0;}).map(function(f){return '<div><span>'+esc(f.original_filename)+' · existing</span><button type="button" data-existing="'+esc(f.file_token)+'">Remove</button></div>';}).join('')+state.attachments.map(function(f,i){return '<div><span>'+esc(f.name)+' · '+Math.ceil(f.size/1024)+' KB</span><button type="button" data-remove="'+i+'">Remove</button></div>';}).join('')+'</div>';if(step===5)html='<h2>Review and submit</h2><p class="muted">Confirm the data before creating an auditable record.</p><div class="review"><div><h3>Metadata</h3>'+config.metadataFields.filter(function(f){return state.metadata[f.key];}).map(function(f){return '<p><span>'+esc(f.label)+'</span><b>'+esc(state.metadata[f.key])+'</b></p>';}).join('')+'</div><div><h3>Vetting</h3>'+config.vettingQuestions.filter(function(q){return state.answers[q.key];}).map(function(q){return '<p><span>'+esc(q.label)+'</span><b>'+esc(state.answers[q.key])+'</b></p>';}).join('')+'</div><div><h3>Attachments</h3><b>'+(state.attachments.length+state.existingFiles.length-state.removeFileIds.length)+' active file(s)</b></div></div>';el('stepPanel').innerHTML=html;el('back').disabled=step===1;el('next').hidden=step===5;el('submit').hidden=step!==5;el('submit').textContent=state.editingId?'Submit correction':'Submit content';document.querySelectorAll('[data-prefix]').forEach(function(node){node.onchange=function(){state[node.dataset.prefix][node.dataset.key]=node.value;};});if(step===4){el('fileInput').onchange=readFiles;document.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){state.attachments.splice(Number(b.dataset.remove),1);render();};});document.querySelectorAll('[data-existing]').forEach(function(b){b.onclick=function(){state.removeFileIds.push(String(b.dataset.existing));render();};});}}
function validateCurrent(){var missing=[];if(step===2)config.metadataFields.forEach(function(f){if(f.required&&!String(state.metadata[f.key]||'').trim())missing.push(f.label);});if(step===3)config.vettingQuestions.forEach(function(q){var visible=!q.showWhen||state.answers[q.showWhen.key]===q.showWhen.equals;if(visible&&q.required&&!String(state.answers[q.key]||'').trim())missing.push(q.label);});if(missing.length){showError('Complete required fields: '+missing.join(', '));return false;}showError('');return true;}
function showError(message){el('formError').hidden=!message;el('formError').textContent=message||'';}el('next').onclick=function(){if(validateCurrent()){step++;render();}};el('back').onclick=function(){step--;showError('');render();};
function readFiles(event){var list=Array.from(event.target.files||[]);Promise.all(list.map(function(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onload=function(){resolve({name:file.name,type:file.type,size:file.size,dataBase64:String(reader.result).split(',')[1]});};reader.onerror=reject;reader.readAsDataURL(file);});})).then(function(files){state.attachments=state.attachments.concat(files);render();}).catch(function(){showError('A selected file could not be read.');});}
el('intakeForm').onsubmit=async function(event){event.preventDefault();var button=el('submit');button.disabled=true;button.textContent='Submitting…';showError('');try{var payload={idempotencyToken:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),submissionType:state.editingId?'CORRECTION':state.answers.change_type==='Correction'?'CORRECTION':'NEW',metadata:state.metadata,answers:state.answers,attachments:state.attachments,removeFileIds:state.removeFileIds};var result=state.editingId?await run('correctSubmission',[state.editingId,payload]):await run('submitContent',[payload]);el('intakeForm').hidden=true;el('success').hidden=false;el('success').innerHTML='<h2>'+(state.editingId?'Correction':'Submission')+' complete</h2><p>Your reference is</p><p class="receipt">'+esc(result.submissionId)+'</p><p>Status: <b>'+esc(result.processingStatus)+'</b> · Destination: '+esc(result.targetSheetTab)+'</p>';}catch(e){showError((e.message||'Submission failed')+(e.submissionId?' Reference: '+e.submissionId:''));}finally{button.disabled=false;button.textContent=state.editingId?'Submit correction':'Submit content';}};
async function loadSubmissions(){el('submissionRows').innerHTML='<tr><td colspan="6">Loading…</td></tr>';try{var rows=await run('listSubmissions');el('submissionRows').innerHTML=rows.length?rows.map(function(r){return '<tr><td><b>'+esc(r.submissionId)+'</b><br><small>'+esc(r.submittedBy)+'</small></td><td>'+esc(r.documentTitle)+'</td><td>'+esc(r.routeKey||'Unresolved')+'</td><td>v'+esc(r.submissionVersion)+'</td><td><span class="status '+String(r.processingStatus).toLowerCase()+'">'+esc(r.processingStatus)+'</span></td><td>'+esc(String(r.updatedAt).slice(0,10))+'<br><button type="button" data-edit="'+esc(r.submissionId)+'">Correct</button></td></tr>';}).join(''):'<tr><td colspan="6">No submissions.</td></tr>';document.querySelectorAll('[data-edit]').forEach(function(button){button.onclick=function(){beginCorrection(button.dataset.edit);};});}catch(e){el('submissionRows').innerHTML='<tr><td colspan="6">'+esc(e.message)+'</td></tr>';}}
async function beginCorrection(id){try{var data=await run('getSubmission',[id]);state={metadata:data.record.metadata||{},answers:{},attachments:[],existingFiles:(data.files||[]).filter(function(f){return String(f.active).toLowerCase()==='true';}),removeFileIds:[],editingId:id};(data.answers||[]).forEach(function(a){state.answers[a.question_key]=a.answer;});state.answers.change_type='Correction';step=1;document.querySelector('[data-page="intake"]').click();el('intakeForm').hidden=false;el('success').hidden=true;render();}catch(e){alert(e.message||'Unable to open correction.');}}
async function loadAdmin(){try{var data=await run('getAdminDashboard');var c=data.counts;el('metrics').innerHTML=[['Total',c.total],['Completed',c.completed],['Failed',c.failed],['Partial',c.partial],['Review',c.requiresReview]].map(function(x){return '<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>';}).join('');}catch(e){el('adminOutput').textContent=e.message;}}function showAdminCall(buttonId,method,progress){el(buttonId).onclick=async function(){el('adminOutput').textContent=progress;try{el('adminOutput').textContent=JSON.stringify(await run(method),null,2);}catch(e){el('adminOutput').textContent=e.message;}};}showAdminCall('healthButton','validateEnvironment','Checking…');showAdminCall('configButton','getAdminConfiguration','Loading governed configuration…');showAdminCall('auditButton','listAuditEvents','Loading audit history…');showAdminCall('aclButton','previewAclChanges','Reading permissions…');el('aclSyncButton').onclick=async function(){if(!confirm('Apply the displayed ACL reconciliation? Protected identities will not be removed.'))return;el('adminOutput').textContent='Synchronizing permissions…';try{el('adminOutput').textContent=JSON.stringify(await run('syncDriveAcl'),null,2);}catch(e){el('adminOutput').textContent=e.message;}};render();
})();
</script>
