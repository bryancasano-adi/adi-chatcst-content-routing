<script>
  (function () {
    'use strict';

    var config = window.APP_BOOTSTRAP;
    var user = window.APP_USER;
    var step = 1;
    var labels = ['Context', 'Metadata', 'Vetting', 'Attachments', 'Review'];
    var state = emptyState_();

    function emptyState_() {
      return {
        metadata: {},
        answers: {},
        attachments: [],
        existingFiles: [],
        removeFileIds: [],
        editingId: '',
        editingVersion: 0,
        errors: {},
      };
    }

    function el(id) {
      return document.getElementById(id);
    }

    function esc(value) {
      var node = document.createElement('div');
      node.textContent = String(value == null ? '' : value);
      return node.innerHTML;
    }

    function titleCaseKey(value) {
      return String(value || '')
        .replace(/_/g, ' ')
        .replace(/\b\w/g, function (character) {
          return character.toUpperCase();
        });
    }

    function formatConditions(value) {
      var conditions = value;
      if (typeof conditions === 'string') {
        try {
          conditions = JSON.parse(conditions);
        } catch (error) {
          return 'Invalid Governed Rule';
        }
      }
      if (!Array.isArray(conditions) || !conditions.length) {
        return 'No Conditions';
      }
      return conditions
        .map(function (condition) {
          var label = titleCaseKey(condition.key);
          if (condition.equals !== undefined) {
            return label + ' is ' + condition.equals;
          }
          if (Array.isArray(condition.in)) {
            return label + ' is one of ' + condition.in.join(', ');
          }
          return label;
        })
        .join(' · ');
    }

    function run(name, args) {
      return new Promise(function (resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (error) {
            reject(normalizeClientError(error));
          });
        runner[name].apply(runner, args || []);
      });
    }

    function normalizeClientError(error) {
      var raw = String((error && error.message) || error || 'Request failed');
      var start = raw.indexOf('{');
      var end = raw.lastIndexOf('}');
      if (start >= 0 && end > start) {
        try {
          var parsed = JSON.parse(raw.slice(start, end + 1));
          return {
            code: parsed.code || 'UNKNOWN_ERROR',
            message: parsed.message || 'The request could not be completed.',
            submissionId: parsed.submissionId || '',
          };
        } catch (parseError) {
          // Fall through to the safe plain-text response.
        }
      }
      return {
        code: 'UNKNOWN_ERROR',
        message: raw.replace(/^(Exception:\s*)?(Error:\s*)?/, ''),
        submissionId: '',
      };
    }

    el('userName').textContent = user.name;
    el('userEmail').textContent = user.email;
    el('roles').textContent = user.roles.join(', ');
    el('adminNav').hidden = !user.privileged;

    function showPage(page, preserveIntake) {
      document.querySelectorAll('.appNavItem').forEach(function (button) {
        var selected = button.dataset.page === page;
        button.classList.toggle('active', selected);
        if (selected) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });

      ['intake', 'submissions', 'admin'].forEach(function (name) {
        el(name + 'Page').hidden = name !== page;
      });

      if (page === 'intake' && !preserveIntake) resetIntake();
      if (page === 'submissions') loadSubmissions();
      if (page === 'admin') loadAdmin();
    }

    document.querySelectorAll('.appNavItem').forEach(function (button) {
      button.onclick = function () {
        showPage(button.dataset.page, false);
      };
    });

    function resetIntake() {
      state = emptyState_();
      step = 1;
      el('intakeForm').hidden = false;
      el('steps').hidden = false;
      el('success').hidden = true;
      hideRecovery();
      showError('');
      render();
    }

    function renderSteps() {
      el('steps').innerHTML = labels
        .map(function (label, index) {
          var number = index + 1;
          var className = step === number ? 'active' : step > number ? 'done' : '';
          var disabled = number >= step ? ' disabled' : '';
          return (
            '<button type="button" data-step="' +
            number +
            '" class="' +
            className +
            '"' +
            disabled +
            '><b>' +
            (step > number ? '✓' : number) +
            '</b><span>' +
            label +
            '</span></button>'
          );
        })
        .join('');

      document.querySelectorAll('[data-step]').forEach(function (button) {
        button.onclick = function () {
          step = Number(button.dataset.step);
          state.errors = {};
          showError('');
          render();
        };
      });
    }

    function input(field, prefix, displayLabel) {
      var value = (state[prefix] || {})[field.key] || '';
      var label = displayLabel || field.label;
      var error = state.errors[prefix + '.' + field.key];
      var attributes =
        ' data-prefix="' +
        esc(prefix) +
        '" data-key="' +
        esc(field.key) +
        '"';
      var control;

      if (field.options && field.options.length) {
        control =
          '<select' +
          attributes +
          '><option value="">Select…</option>' +
          field.options
            .map(function (option) {
              return (
                '<option value="' +
                esc(option) +
                '" ' +
                (option === value ? 'selected' : '') +
                '>' +
                esc(option) +
                '</option>'
              );
            })
            .join('') +
          '</select>';
      } else if (field.type === 'textarea') {
        control = '<textarea' + attributes + '>' + esc(value) + '</textarea>';
      } else {
        control =
          '<input' +
          attributes +
          ' type="' +
          (field.type === 'date' ? 'date' : 'text') +
          '" value="' +
          esc(value) +
          '">';
      }

      return (
        '<label class="field"><span>' +
        esc(label) +
        (field.required ? ' *' : '') +
        '</span>' +
        control +
        (field.helpText ? '<small>' + esc(field.helpText) + '</small>' : '') +
        (error ? '<small class="error">' + esc(error) + '</small>' : '') +
        '</label>'
      );
    }

    function visibleQuestions_() {
      return config.vettingQuestions.filter(function (question) {
        return (
          !question.showWhen ||
          state.answers[question.showWhen.key] === question.showWhen.equals
        );
      });
    }

    function activeFileCount_() {
      return (
        state.attachments.length +
        state.existingFiles.length -
        state.removeFileIds.length
      );
    }

    function render() {
      renderSteps();
      el('intakeTitle').textContent = state.editingId
        ? 'Update ' + state.editingId
        : 'Route Content to ChatCST';
      el('intakeBadge').textContent = state.editingId
        ? 'Version ' + (state.editingVersion + 1)
        : 'Draft';

      var html = '';
      if (step === 1) {
        html =
          '<h2>Submission Context</h2>' +
          '<p class="muted">Your Workspace identity is verified again by the production server.</p>' +
          '<div class="contextGrid"><div><span>Submitting As</span><strong>' +
          esc(user.email) +
          '</strong></div><div><span>Access</span><strong>Workspace identity verified</strong></div></div>';
      }

      if (step === 2) {
        html =
          '<h2>Document Metadata</h2>' +
          '<p class="muted">Fields marked * are required.</p>' +
          '<div class="grid">' +
          config.metadataFields
            .map(function (field) {
              return input(field, 'metadata');
            })
            .join('') +
          '</div>';
      }

      if (step === 3) {
        html =
          '<h2>Vetting Questions</h2>' +
          '<p class="muted">Answers drive deterministic routing to governed destinations.</p>' +
          '<div class="questions">' +
          visibleQuestions_()
            .map(function (question) {
              return input(
                question,
                'answers',
                question.displayOrder + '. ' + question.label,
              );
            })
            .join('') +
          '</div>';
      }

      if (step === 4) {
        var existingFiles = state.existingFiles
          .filter(function (file) {
            return state.removeFileIds.indexOf(String(file.file_token)) < 0;
          })
          .map(function (file) {
            return (
              '<div><span><b>' +
              esc(file.original_filename) +
              '</b><small>Existing attachment</small></span><button type="button" data-existing="' +
              esc(file.file_token) +
              '">Remove</button></div>'
            );
          })
          .join('');
        var newFiles = state.attachments
          .map(function (file, index) {
            return (
              '<div><span><b>' +
              esc(file.name) +
              '</b> · <small>' +
              (file.size / 1024).toFixed(1) +
              ' KB</small></span><button type="button" data-remove="' +
              index +
              '">Remove</button></div>'
            );
          })
          .join('');
        html =
          '<h2>Supporting Attachments</h2>' +
          '<p class="muted">' +
          esc(config.filePolicy.allowedExtensions.map(function (extension) { return extension.toUpperCase(); }).join(', ')) +
          ' · up to ' +
          Math.round(config.filePolicy.maxFileSizeBytes / 1024 / 1024) +
          ' MB each · maximum ' +
          config.filePolicy.maxFileCount +
          ' files.</p>' +
          '<label class="dropzone"><input id="fileInput" type="file" multiple accept=".' +
          config.filePolicy.allowedExtensions.join(',.') +
          '"><b>Choose Files</b><span>or drag them here</span></label>' +
          (state.errors.attachments
            ? '<p class="error">' + esc(state.errors.attachments) + '</p>'
            : '') +
          '<div class="fileList">' +
          existingFiles +
          newFiles +
          '</div>';
      }

      if (step === 5) {
        html =
          '<h2>Review and Submit</h2>' +
          '<p class="muted">Confirm these details before creating the auditable record.</p>' +
          '<div class="review"><div><h3>Metadata</h3>' +
          config.metadataFields
            .filter(function (field) {
              return state.metadata[field.key];
            })
            .map(function (field) {
              return (
                '<p><span>' +
                esc(field.label) +
                '</span><b>' +
                esc(state.metadata[field.key]) +
                '</b></p>'
              );
            })
            .join('') +
          '</div><div><h3>Vetting</h3>' +
          config.vettingQuestions
            .filter(function (question) {
              return state.answers[question.key];
            })
            .map(function (question) {
              return (
                '<p><span>' +
                esc(question.label) +
                '</span><b>' +
                esc(state.answers[question.key]) +
                '</b></p>'
              );
            })
            .join('') +
          '</div><div><h3>Attachments</h3><p><span>Files</span><b>' +
          (activeFileCount_() || 'None') +
          '</b></p></div><div class="routePreview"><h3>Resolved Route</h3><strong>Resolved on Submission</strong><span>The server applies the active governed route.</span></div></div>';
      }

      el('stepPanel').innerHTML = html;
      el('back').disabled = step === 1;
      el('next').hidden = step === 5;
      el('submit').hidden = step !== 5;
      el('submit').textContent = state.editingId
        ? 'Submit Update'
        : 'Submit Content';

      document.querySelectorAll('[data-prefix]').forEach(function (node) {
        node.oninput = node.onchange = function () {
          state[node.dataset.prefix][node.dataset.key] = node.value;
          delete state.errors[node.dataset.prefix + '.' + node.dataset.key];
          hideRecovery();
          showError('');
        };
      });

      if (step === 4) {
        el('fileInput').onchange = readFiles;
        document.querySelectorAll('[data-remove]').forEach(function (button) {
          button.onclick = function () {
            state.attachments.splice(Number(button.dataset.remove), 1);
            validateFiles_();
            render();
          };
        });
        document.querySelectorAll('[data-existing]').forEach(function (button) {
          button.onclick = function () {
            state.removeFileIds.push(String(button.dataset.existing));
            render();
          };
        });
      }
    }

    function validateFiles_() {
      var policy = config.filePolicy;
      var existingTotal = state.existingFiles
        .filter(function (file) {
          return state.removeFileIds.indexOf(String(file.file_token)) < 0;
        })
        .reduce(function (sum, file) {
          return sum + Number(file.size_bytes || 0);
        }, 0);
      var total = state.attachments.reduce(function (sum, file) {
        return sum + file.size;
      }, existingTotal);
      var invalid = state.attachments.find(function (file) {
        var extension = String(file.name).split('.').pop().toLowerCase();
        return (
          policy.allowedExtensions.indexOf(extension) < 0 ||
          file.size > policy.maxFileSizeBytes
        );
      });
      var message = '';
      if (activeFileCount_() > policy.maxFileCount) {
        message = 'Attach no more than ' + policy.maxFileCount + ' files.';
      } else if (total > policy.maxTotalSizeBytes) {
        message = 'The selected files exceed the total upload limit.';
      } else if (invalid) {
        message = invalid.name + ' is not an allowed file or exceeds the size limit.';
      }

      if (message) state.errors.attachments = message;
      else delete state.errors.attachments;
      return !message;
    }

    function validateCurrent() {
      state.errors = {};
      var missing = [];
      var fields = [];
      var prefix = '';

      if (step === 2) {
        fields = config.metadataFields;
        prefix = 'metadata';
      } else if (step === 3) {
        fields = visibleQuestions_();
        prefix = 'answers';
      }

      fields.forEach(function (field) {
        if (field.required && !String(state[prefix][field.key] || '').trim()) {
          state.errors[prefix + '.' + field.key] = field.label + ' is required.';
          missing.push(field.label);
        }
      });

      if (step === 4 && !validateFiles_()) {
        showError('Correct the attachment issues before continuing.');
        render();
        return false;
      }

      if (missing.length) {
        showError(
          step === 2
            ? 'Complete the required metadata before continuing.'
            : 'Answer the required vetting questions before continuing.',
        );
        render();
        return false;
      }

      showError('');
      return true;
    }

    function showError(message) {
      el('formError').hidden = !message;
      el('formError').textContent = message || '';
    }

    function hideRecovery() {
      el('submissionRecovery').hidden = true;
      el('submissionRecovery').innerHTML = '';
    }

    function showRecovery(error) {
      var panel = el('submissionRecovery');
      var isRoutingIssue = error.code === 'ROUTE_NOT_FOUND';
      panel.hidden = false;
      panel.innerHTML =
        '<div><h3>Submission Needs Attention</h3><p>' +
        esc(error.message || 'The submission could not be completed.') +
        '</p>' +
        (error.submissionId
          ? '<small>Submission Reference: ' + esc(error.submissionId) + '</small>'
          : '') +
        '</div><div class="recoveryActions">' +
        (isRoutingIssue
          ? '<button type="button" id="updateHeldSubmission">Update Answers</button>'
          : !error.submissionId
            ? '<button type="button" id="dismissSubmissionError">Try Again</button>'
            : '') +
        (error.submissionId
          ? '<button type="button" class="primary" id="viewHeldSubmission">View Submissions</button>'
          : '') +
        '</div>';

      if (isRoutingIssue) {
        el('updateHeldSubmission').onclick = function () {
          if (error.submissionId) beginCorrection(error.submissionId, 3);
          else {
            step = 3;
            hideRecovery();
            el('submit').disabled = false;
            render();
          }
        };
      }
      if (!isRoutingIssue && !error.submissionId) {
        el('dismissSubmissionError').onclick = function () {
          hideRecovery();
          el('submit').disabled = false;
        };
      }
      if (error.submissionId) {
        el('viewHeldSubmission').onclick = function () {
          showPage('submissions', false);
        };
      }
    }

    el('next').onclick = function () {
      if (!validateCurrent()) return;
      step = Math.min(labels.length, step + 1);
      render();
    };

    el('back').onclick = function () {
      step = Math.max(1, step - 1);
      state.errors = {};
      showError('');
      render();
    };

    function readFiles(event) {
      var list = Array.from(event.target.files || []);
      Promise.all(
        list.map(function (file) {
          return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function () {
              resolve({
                name: file.name,
                type: file.type,
                size: file.size,
                dataBase64: String(reader.result).split(',')[1],
              });
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }),
      )
        .then(function (files) {
          state.attachments = state.attachments.concat(files);
          validateFiles_();
          render();
        })
        .catch(function () {
          showError('A selected file could not be read.');
        });
    }

    el('intakeForm').onsubmit = async function (event) {
      event.preventDefault();
      var button = el('submit');
      button.disabled = true;
      button.textContent = 'Submitting…';
      hideRecovery();
      showError('');

      try {
        var payload = {
          idempotencyToken: crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()),
          submissionType: state.editingId ? 'CORRECTION' : 'NEW',
          metadata: state.metadata,
          answers: state.answers,
          attachments: state.attachments,
          removeFileIds: state.removeFileIds,
        };
        var result = state.editingId
          ? await run('correctSubmission', [state.editingId, payload])
          : await run('submitContent', [payload]);

        el('intakeForm').hidden = true;
        el('steps').hidden = true;
        el('success').hidden = false;
        el('success').innerHTML =
          '<div class="successIcon">✓</div><h2>' +
          (state.editingId ? 'Update Complete' : 'Submission Complete') +
          '</h2><p>Your content was validated, routed, and recorded.</p>' +
          '<div class="receipt"><span>Submission Reference</span><strong>' +
          esc(result.submissionId) +
          '</strong><span>Destination</span><b>' +
          esc(result.targetSheetTab) +
          '</b><span>Status</span><b class="status completed">' +
          esc(result.processingStatus) +
          '</b></div><button type="button" class="primary" id="viewSubmissions">View Submissions</button>';
        el('viewSubmissions').onclick = function () {
          showPage('submissions', false);
        };
      } catch (error) {
        showRecovery(error);
      } finally {
        button.disabled = !el('submissionRecovery').hidden;
        button.textContent = state.editingId
          ? 'Submit Update'
          : 'Submit Content';
      }
    };

    async function loadSubmissions() {
      el('submissionEmpty').hidden = true;
      el('submissionRows').innerHTML =
        '<tr><td colspan="7">Loading submissions…</td></tr>';
      try {
        var rows = await run('listSubmissions');
        el('submissionRows').innerHTML = rows
          .map(function (record) {
            var actions =
              record.processingStatus === 'DELETED'
                ? '<span class="muted">No Actions</span>'
                : '<div class="rowActions"><button type="button" data-edit="' +
                  esc(record.submissionId) +
                  '">Update</button><button type="button" class="dangerButton" data-delete="' +
                  esc(record.submissionId) +
                  '">Delete</button></div>';
            return (
              '<tr><td><b>' +
              esc(record.submissionId) +
              '</b><small>' +
              esc(record.submittedBy) +
              '</small></td><td>' +
              esc(record.documentTitle) +
              '</td><td>' +
              esc(record.routeKey || 'Unresolved') +
              '</td><td>v' +
              esc(record.submissionVersion) +
              '</td><td><span class="status ' +
              String(record.processingStatus).toLowerCase() +
              '">' +
              esc(record.processingStatus) +
              '</span></td><td>' +
              esc(String(record.updatedAt).slice(0, 10)) +
              '</td><td>' +
              actions +
              '</td></tr>'
            );
          })
          .join('');
        el('submissionEmpty').hidden = rows.length !== 0;

        document.querySelectorAll('[data-edit]').forEach(function (button) {
          button.onclick = function () {
            beginCorrection(button.dataset.edit);
          };
        });
        document.querySelectorAll('[data-delete]').forEach(function (button) {
          button.onclick = function () {
            deleteSubmission_(button.dataset.delete);
          };
        });
      } catch (error) {
        el('submissionRows').innerHTML =
          '<tr><td colspan="7">' + esc(error.message) + '</td></tr>';
      }
    }

    async function deleteSubmission_(id) {
      if (
        !window.confirm(
          'Delete ' +
            id +
            '? Routed data will be removed and files will be moved to Trash. The audit record will be retained.',
        )
      ) {
        return;
      }
      try {
        await run('deleteSubmission', [id]);
        await loadSubmissions();
      } catch (error) {
        window.alert(error.message || 'The submission could not be deleted.');
      }
    }

    async function beginCorrection(id, startStep) {
      try {
        var data = await run('getSubmission', [id]);
        state = {
          metadata: data.record.metadata || {},
          answers: {},
          attachments: [],
          existingFiles: (data.files || []).filter(function (file) {
            return String(file.active).toLowerCase() === 'true';
          }),
          removeFileIds: [],
          editingId: id,
          editingVersion: Number(data.record.submission_version || 0),
          errors: {},
        };
        (data.answers || []).forEach(function (answer) {
          state.answers[answer.question_key] = answer.answer;
        });
        state.answers.change_type = 'Correction';
        step = startStep || 1;
        el('intakeForm').hidden = false;
        el('steps').hidden = false;
        el('success').hidden = true;
        hideRecovery();
        showPage('intake', true);
        render();
      } catch (error) {
        window.alert(error.message || 'Unable to open the submission update.');
      }
    }

    async function loadAdmin() {
      try {
        var results = await Promise.all([
          run('getAdminDashboard'),
          run('getAdminConfiguration'),
        ]);
        var counts = results[0].counts;
        var activeRoutes = results[1].routes.filter(function (route) {
          return String(route.active).toLowerCase() === 'true';
        }).length;
        var metrics = [
          ['Total Submissions', counts.total],
          ['Completed', counts.completed],
          [
            'Needs Attention',
            counts.failed + counts.partial + counts.requiresReview,
          ],
          ['Active Routes', activeRoutes],
        ];
        el('metrics').innerHTML = metrics
          .map(function (metric) {
            return (
              '<div><span>' +
              metric[0] +
              '</span><b>' +
              metric[1] +
              '</b></div>'
            );
          })
          .join('');
        setActiveAdminView('configButton');
        renderConfiguration(results[1]);
      } catch (error) {
        el('adminOutput').textContent = error.message;
      }
    }

    function setActiveAdminView(buttonId) {
      document.querySelectorAll('.adminButtons button').forEach(function (button) {
        button.classList.toggle('active', button.id === buttonId);
        button.setAttribute('aria-selected', button.id === buttonId ? 'true' : 'false');
      });
    }

    function showAdminLoading(buttonId, message) {
      setActiveAdminView(buttonId);
      el('adminOutput').innerHTML =
        '<div class="emptyState"><strong>' +
        esc(message) +
        '</strong><span>Please wait.</span></div>';
    }

    function showAdminError(error) {
      el('adminOutput').innerHTML =
        '<div class="errorBox"><strong>Unable to Load View</strong><br>' +
        esc(error.message || 'The administrative view could not be loaded.') +
        '</div>';
    }

    function renderHealth(report) {
      el('adminOutput').innerHTML =
        '<div class="sectionHeading"><div><h3>Environment Health</h3><p>Checked ' +
        esc(String(report.checkedAt || '').replace('T', ' ').slice(0, 19)) +
        '</p></div><span class="status ' +
        (report.valid ? 'completed' : 'failed') +
        '">' +
        (report.valid ? 'HEALTHY' : 'NEEDS ATTENTION') +
        '</span></div><div class="checkList">' +
        (report.checks || [])
          .map(function (check) {
            return (
              '<div><span class="checkIcon ' +
              (check.ok ? 'ok' : '') +
              '">' +
              (check.ok ? '✓' : '!') +
              '</span><span><strong>' +
              esc(check.name) +
              '</strong><small>' +
              esc(check.ok ? 'Check passed.' : check.message || check.code) +
              '</small></span><b>' +
              (check.ok ? 'Passed' : 'Needs Attention') +
              '</b></div>'
            );
          })
          .join('') +
        '</div>';
    }

    function renderConfiguration(data) {
      var activeRoutes = (data.routes || []).filter(function (route) {
        return String(route.active).toLowerCase() === 'true';
      }).length;
      el('adminOutput').innerHTML =
        '<div class="sectionHeading"><div><h3>Governed Configuration</h3><p>' +
        (data.questions || []).length +
        ' Vetting Questions · ' +
        (data.roles || []).length +
        ' Roles · ' +
        activeRoutes +
        ' Active Routes</p></div></div>' +
        '<div class="adminTableWrap"><table><thead><tr><th>Route</th><th>Destination</th><th>Conditions</th><th>Version</th><th>Status</th></tr></thead><tbody>' +
        (data.routes || [])
          .map(function (route) {
            return (
              '<tr><td><b>' +
              esc(route.routeKey) +
              '</b></td><td>' +
              esc(route.dataSummaryTab) +
              '</td><td><code>' +
              esc(formatConditions(route.conditions)) +
              '</code></td><td>v' +
              esc(route.version) +
              '</td><td><span class="status ' +
              (String(route.active).toLowerCase() === 'true' ? 'completed' : '') +
              '">' +
              (String(route.active).toLowerCase() === 'true' ? 'ACTIVE' : 'INACTIVE') +
              '</span></td></tr>'
            );
          })
          .join('') +
        '</tbody></table></div>';
    }

    function renderAudit(events) {
      var rows = events || [];
      el('adminOutput').innerHTML =
        '<div class="sectionHeading"><div><h3>Recent Audit Activity</h3><p>Immutable workflow events, newest first.</p></div><span class="countBadge">' +
        rows.length +
        ' Events</span></div>' +
        (rows.length
          ? '<div class="adminTableWrap"><table><thead><tr><th>Event</th><th>Submission</th><th>Actor</th><th>Result</th><th>Occurred</th></tr></thead><tbody>' +
            rows
              .map(function (event) {
                return (
                  '<tr><td><b>' +
                  esc(String(event.event_type || '').replace(/_/g, ' ')) +
                  '</b></td><td>' +
                  esc(event.submission_id || 'System') +
                  '</td><td>' +
                  esc(event.actor_email) +
                  '</td><td><span class="status ' +
                  (event.result === 'SUCCESS' ? 'completed' : 'failed') +
                  '">' +
                  esc(event.result) +
                  '</span></td><td>' +
                  esc(String(event.occurred_at || '').replace('T', ' ').slice(0, 19)) +
                  '</td></tr>'
                );
              })
              .join('') +
            '</tbody></table></div>'
          : '<div class="emptyState"><strong>No Audit Events</strong><span>Workflow activity will appear here.</span></div>');
    }

    function renderAcl(diff) {
      var groups = [
        ['Add', diff.add || []],
        ['Change', diff.change || []],
        ['Remove', diff.remove || []],
        ['Protected', diff.protected || []],
      ];
      var details = groups
        .filter(function (group) {
          return group[1].length;
        })
        .map(function (group) {
          return (
            '<section class="aclGroup"><h4>' +
            group[0] +
            '</h4><div class="checkList">' +
            group[1]
              .map(function (grant) {
                return (
                  '<div><span class="checkIcon protected">●</span><span><strong>' +
                  esc(grant.email) +
                  '</strong><small>Folder: ' +
                  esc(grant.folderId) +
                  '</small></span><b>' +
                  esc(grant.permission) +
                  '</b></div>'
                );
              })
              .join('') +
            '</div></section>'
          );
        })
        .join('');
      el('adminOutput').innerHTML =
        '<div class="sectionHeading"><div><h3>ACL Change Preview</h3><p>Read-only access reconciliation preview. No changes are applied.</p></div></div>' +
        '<div class="aclSummary">' +
        groups
          .map(function (group) {
            return '<div><span>' + group[0] + '</span><strong>' + group[1].length + '</strong></div>';
          })
          .join('') +
        '</div>' +
        (details ||
          '<div class="emptyState"><strong>No ACL Changes</strong><span>Current permissions match the governed access matrix.</span></div>');
    }

    el('healthButton').onclick = async function () {
      showAdminLoading('healthButton', 'Checking Environment Health');
      try {
        renderHealth(await run('validateEnvironment'));
      } catch (error) {
        showAdminError(error);
      }
    };

    el('configButton').onclick = async function () {
      showAdminLoading('configButton', 'Loading Governed Configuration');
      try {
        renderConfiguration(await run('getAdminConfiguration'));
      } catch (error) {
        showAdminError(error);
      }
    };

    el('auditButton').onclick = async function () {
      showAdminLoading('auditButton', 'Loading Audit Activity');
      try {
        renderAudit(await run('listAuditEvents'));
      } catch (error) {
        showAdminError(error);
      }
    };

    el('aclButton').onclick = async function () {
      showAdminLoading('aclButton', 'Building ACL Preview');
      try {
        renderAcl(await run('previewAclChanges'));
      } catch (error) {
        showAdminError(error);
      }
    };

    render();
  })();
</script>
